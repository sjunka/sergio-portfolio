<!doctype html>
<!--
  Template for the per-post share card. `npm run og` substitutes {{title}},
  the title, summary and date, renders it, and writes public/blog/og/<slug>.jpg.
  Never edited by hand for one post: change it here and re-run for all of them.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #080d1a;
        font-family: 'Inter', sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      .glow {
        position: absolute;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        filter: blur(110px);
        right: -240px;
        top: -300px;
        background: radial-gradient(circle, rgba(124, 108, 246, 0.42), transparent 68%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 80% 90% at 60% 30%, #000, transparent 80%);
      }

      .card {
        position: relative;
        height: 100%;
        padding: 62px 72px;
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }
      .eyebrow b {
        color: #a3a8ff;
        font-weight: 500;
      }

      /* The title is the card. Its size comes from og.mjs, which picks a step
         from the character count: a 30-character title and a 90-character one
         cannot share a font size without one of them looking wrong. */
      h1 {
        margin-top: 36px;
        font-size: {{titleSize}};
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.08;
        max-width: 1000px;
        background: linear-gradient(100deg, #ffffff 40%, #c9cbff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .summary {
        margin-top: 26px;
        max-width: 940px;
        font-size: 25px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.62);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding-top: 26px;
      }
      footer img {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 42% 14%;
        filter: saturate(0.8) brightness(0.95);
      }
      .who {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .role {
        margin-top: 3px;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.45);
      }
      .stamp {
        margin-left: auto;
        text-align: right;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="card">
      <p class="eyebrow">sergiojunca.online <b>/ blog</b></p>

      <h1>{{title}}</h1>
      <p class="summary">{{summary}}</p>

      <footer>
        <img src="../public/avatar.png" alt="" />
        <div>
          <p class="who">Sergio Junca</p>
          <p class="role">Senior Software Engineer</p>
        </div>
        <p class="stamp">{{stamp}}</p>
      </footer>
    </div>
  </body>
</html>
