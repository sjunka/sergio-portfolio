<!doctype html>
<!--
  Source for public/share-card.jpg. Rendered by `npm run og` (scripts/og.mjs).
  Edit here, re-run, commit the jpg — social crawlers never see this file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #080d1a;
        font-family: 'Inter', sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Portrait: full-bleed on the right, dissolved into the card ──────
         The source headshot has a bright office behind it, which would read as
         a rectangle pasted onto a dark card. Darkening it, pulling saturation
         down and masking its left edge to transparent makes it part of the
         background instead of a photo sitting on top of one. */
      .portrait {
        position: absolute;
        inset: 0 0 0 auto;
        width: 470px;
        overflow: hidden;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 42% 14%;
        filter: saturate(0.68) contrast(1.04) brightness(0.86);
        mask-image: linear-gradient(90deg, transparent, #000 40%);
      }
      /* Indigo cast, so the photo sits in the same light as the type */
      .portrait::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(30, 27, 90, 0.55), rgba(30, 27, 90, 0.18) 60%, transparent);
        mix-blend-mode: soft-light;
        mask-image: linear-gradient(90deg, transparent, #000 40%);
      }

      /* Ambient light, the same indigo that sits behind the phone on the site */
      .glow {
        position: absolute;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        filter: blur(100px);
        left: -180px;
        bottom: -280px;
        background: radial-gradient(circle, rgba(124, 108, 246, 0.4), transparent 68%);
      }

      /* Hairline grid: the pixel grid a UI gets laid out on */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 70% 90% at 22% 45%, #000, transparent 78%);
      }

      .card {
        position: relative;
        height: 100%;
        width: 790px;
        padding: 62px 0 62px 72px;
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
      }

      h1 {
        margin-top: 40px;
        font-size: 94px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .role {
        margin-top: 14px;
        font-size: 41px;
        font-weight: 600;
        letter-spacing: -0.025em;
        background: linear-gradient(100deg, #7c8cff, #b06bff 52%, #45c8f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .lede {
        margin-top: 28px;
        max-width: 590px;
        font-size: 25px;
        font-weight: 400;
        line-height: 1.44;
        color: rgba(255, 255, 255, 0.66);
      }

      /* ── Writing: the reason the link is worth opening ── */
      .writing {
        margin-top: auto;
        max-width: 620px;
        border-left: 3px solid #7c8cff;
        padding-left: 22px;
      }
      .writing .label {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a3a8ff;
      }
      .writing .title {
        margin-top: 10px;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.26;
        color: rgba(255, 255, 255, 0.95);
      }
      .writing .more {
        margin-top: 10px;
        font-size: 18px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="portrait"><img src="../public/avatar.png" alt="" /></div>

    <div class="card">
      <p class="eyebrow">sergiojunca.online</p>

      <h1>Sergio Junca</h1>
      <p class="role">Senior Software Engineer</p>

      <p class="lede">Ten years shipping production apps across fintech, gaming, healthcare and logistics.</p>

      <div class="writing">
        <p class="label">Latest writing</p>
        <p class="title">Your FlatList isn't slow, your renderItem is</p>
        <p class="more">and two more posts on shipping mobile</p>
      </div>
    </div>
  </body>
</html>
