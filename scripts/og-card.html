<!doctype html>
<!--
  Source for public/og-card.jpg. Rendered by `npm run og` (scripts/og.mjs).
  Edit here, re-run, commit the jpg — social crawlers never see this file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 400;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 600;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 700;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #080d1a;
        font-family: 'Inter', sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      /* Ambient light, the same indigo that sits behind the phone on the site */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .glow-a {
        width: 640px;
        height: 640px;
        right: -60px;
        top: -180px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.5), transparent 68%);
      }
      .glow-b {
        width: 520px;
        height: 520px;
        left: -160px;
        bottom: -240px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.32), transparent 68%);
      }

      /* Hairline grid: the pixel grid a mobile UI is laid out on */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 90% 80% at 30% 40%, #000, transparent 75%);
      }

      .card {
        position: relative;
        height: 100%;
        padding: 66px 72px;
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .eyebrow img {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 18%;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.16);
      }
      .eyebrow span {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }

      h1 {
        margin-top: 44px;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.94;
      }
      h1 .accent {
        background: linear-gradient(100deg, #6f72f2, #a855f7 55%, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .role {
        margin-top: 26px;
        max-width: 560px;
        font-size: 29px;
        font-weight: 600;
        line-height: 1.32;
        letter-spacing: -0.015em;
        color: rgba(255, 255, 255, 0.82);
      }

      .marks {
        margin-top: auto;
        display: flex;
        gap: 52px;
      }
      .marks div {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .marks b {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.03em;
      }
      .marks b i {
        font-style: normal;
        color: #8b8df5;
      }
      .marks span {
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.5);
      }

      /* ── The device: the site's signature element, cropped off the edge ── */
      .phone {
        position: absolute;
        right: 74px;
        top: 84px;
        width: 316px;
        height: 660px;
        border-radius: 54px;
        padding: 3px;
        background: linear-gradient(160deg, #6b7590, #232838 45%, #616b85);
        transform: rotate(-7deg);
        box-shadow: -40px 50px 110px rgba(0, 0, 0, 0.65);
      }
      .screen {
        height: 100%;
        border-radius: 51px;
        overflow: hidden;
        background: linear-gradient(165deg, #171a3d, #0a0f1f 55%, #1c1030);
        position: relative;
        padding: 26px 30px 0;
      }
      .island {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        width: 104px;
        height: 24px;
        border-radius: 99px;
        background: #000;
      }

      .host {
        margin-top: 30px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      .owner {
        margin-top: 6px;
        font-size: 17px;
        font-weight: 600;
      }

      .apps {
        margin-top: 32px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 26px 34px;
      }
      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
      }
      .app i {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      }
      .app svg {
        width: 32px;
        height: 32px;
      }
      .app span {
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
      }

      .widget {
        margin-top: 34px;
        border-radius: 20px;
        padding: 16px 18px 18px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .widget p:first-child {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }
      .widget p:last-child {
        margin-top: 9px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.92);
      }
    </style>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grid"></div>

    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <p class="host">sergiojunca.online</p>
        <p class="owner">Sergio Junca</p>

        <div class="apps">
          <div class="app">
            <i style="background: linear-gradient(145deg, #6f72f2, #9333ea)">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
                <circle cx="12" cy="8.5" r="3.5" />
                <path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5" />
              </svg>
            </i>
            <span>About</span>
          </div>
          <div class="app">
            <i style="background: linear-gradient(145deg, #0ea5e9, #6f72f2)">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
                <path d="M6 4h9l3 3v13H6z" />
                <path d="M9 10h6M9 13.5h6M9 17h3.5" />
              </svg>
            </i>
            <span>Writing</span>
          </div>
          <div class="app">
            <i style="background: linear-gradient(145deg, #27b083, #0d94d4)">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
                <path d="M12 4v11" />
                <path d="M7.5 10.5 12 15l4.5-4.5" />
                <path d="M5 19h14" />
              </svg>
            </i>
            <span>Resume</span>
          </div>
          <div class="app">
            <i style="background: linear-gradient(145deg, #a855f7, #ec4899)">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
                <rect x="3.5" y="6" width="17" height="12" rx="2" />
                <path d="m4 7.5 8 5.5 8-5.5" />
              </svg>
            </i>
            <span>Contact</span>
          </div>
        </div>

        <div class="widget">
          <p>Writing / 001</p>
          <p>Your FlatList isn't slow,<br />your renderItem is</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">
        <img src="../public/avatar.png" alt="" />
        <span>sergiojunca.online</span>
      </div>

      <h1>
        Sergio<br />
        <span class="accent">Junca</span>
      </h1>

      <p class="role">Senior mobile engineer.<br />React Native, iOS and Android.</p>

      <div class="marks">
        <div><b>10<i>+</i></b><span>years shipping</span></div>
        <div><b>7</b><span>industries</span></div>
        <div><b>2</b><span>platforms, one codebase</span></div>
      </div>
    </div>
  </body>
</html>
